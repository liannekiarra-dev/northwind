apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploy the workload into the namespace that Terraform provisions.
namespace: northwind

# Add common labels without touching the (immutable) pod selector.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: northwind-logistics
      app.kubernetes.io/managed-by: kustomize

resources:
  - deployment.yaml
  - service.yaml

# Central place to override the image tag for the registry/CI path, e.g.:
#   kustomize edit set image northwind-delivery=ghcr.io/<owner>/northwind-delivery:<sha>
images:
  - name: northwind-delivery
    newName: northwind-delivery
    newTag: local
