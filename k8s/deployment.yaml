apiVersion: apps/v1
kind: Deployment
metadata:
  name: northwind-delivery
  labels:
    app.kubernetes.io/name: northwind-delivery
    app.kubernetes.io/component: api
spec:
  # Two replicas so the Service load-balances and a rolling update never
  # drops to zero available pods.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: northwind-delivery
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: northwind-delivery
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: northwind-delivery
          image: northwind-delivery:local
          # Use the locally built/loaded image on a single-node cluster;
          # switch to Always + a registry ref for the CI/registry path.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # Pick up environment configuration provisioned by Terraform.
          # optional: true keeps the Deployment applyable on its own, before
          # Terraform has run, falling back to the image defaults.
          envFrom:
            - configMapRef:
                name: northwind-delivery-config
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
